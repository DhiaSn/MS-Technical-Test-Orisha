# Local run only. Credentials are throwaway defaults for a container bound to 127.0.0.1.
name: reception

services:
  postgres:
    image: postgres:17-alpine
    container_name: reception-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-reception}
      POSTGRES_USER: ${POSTGRES_USER:-reception}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reception_local_dev}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - reception

networks:
  reception:
    name: reception

volumes:
  pgdata:
